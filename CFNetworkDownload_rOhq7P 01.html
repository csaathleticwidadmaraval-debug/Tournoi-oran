<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#060B18; --bg2:#0A1226; --surface:#0F1B36; --surface-2:#16244A;
    --line:rgba(200,215,255,0.13); --text:#EAF0FF; --dim:#7C8CB5;
    --accent:#4C8EFF; --accent-dark:#1E4FA8; --accent2:#8B6CF7;
    --win:#3DDC97; --red:#FF5C7A; --yellow:#FFD166;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 60%);color:var(--text);
    font-family:'Almarai','Poppins',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  header.top{padding:20px 18px 14px;text-align:center;position:relative;}
  .langsw{position:absolute;top:16px;inset-inline-end:16px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .langsw button{border:none;background:none;color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;}
  .langsw button.active{background:var(--accent);color:#04101f;}
  header.top h1{font-size:18px;font-weight:800;margin:0;letter-spacing:0.2px;}
  header.top .season{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent);background:rgba(76,142,255,0.12);border:1px solid rgba(76,142,255,0.35);border-radius:20px;padding:3px 12px;}
  header.top .sub{font-size:11.5px;color:var(--dim);margin-top:8px;}
  header.top .rule{width:44px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:12px auto 0;border-radius:2px;}

  main{flex:1;padding:4px 16px 92px;}
  .subtabs{display:flex;gap:6px;margin:14px 0 16px;overflow-x:auto;padding-bottom:2px;}
  .subtabs button{flex:0 0 auto;background:var(--surface);color:var(--dim);border:1px solid var(--line);padding:7px 13px;border-radius:20px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
  .subtabs button.active{background:var(--accent);color:#04101f;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dark);}

  .banner{background:linear-gradient(135deg, rgba(76,142,255,0.16), rgba(139,108,247,0.10));border:1px solid rgba(76,142,255,0.3);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .banner .lbl{font-size:11px;color:var(--dim);}
  .banner .teams{font-size:13px;font-weight:700;margin-top:2px;}
  .banner .cd{font-size:16px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:8px;}

  table.standings{width:100%;border-collapse:collapse;font-size:12px;}
  table.standings th{color:var(--dim);font-weight:700;font-size:10.5px;padding:8px 3px;text-align:center;border-bottom:1px solid var(--line);}
  table.standings th.name-col,table.standings td.name-col{text-align:start;padding-inline-start:4px;}
  table.standings td{padding:9px 3px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  table.standings td.name-col{font-weight:700;font-size:12.5px;cursor:pointer;}
  table.standings td.pts{color:var(--accent);font-weight:800;font-size:13.5px;}
  table.standings tr.top3 td.name-col{border-inline-start:3px solid var(--accent);}
  table.standings tr:nth-child(even){background:rgba(234,240,255,0.02);}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle;}
  .empty-note{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.9;}

  .field-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .field-row label{font-size:12px;color:var(--dim);}
  input[type=date],input[type=month],input[type=text],input[type=number],input[type=password],input[type=color],select,textarea{
    background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;flex:1;min-width:0;}
  input[type=color]{flex:none;width:40px;padding:2px;height:36px;}
  textarea{resize:vertical;min-height:50px;width:100%;}

  button.primary,button.ghost,button.danger{cursor:pointer;font-family:inherit;transition:transform .08s, box-shadow .08s;}
  button.primary{background:linear-gradient(180deg,#6AA3FF,var(--accent));color:#04101f;border:none;border-radius:11px;padding:11px 18px;font-weight:800;font-size:13px;box-shadow:0 5px 0 var(--accent-dark), 0 8px 16px rgba(76,142,255,0.3);}
  button.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark), 0 2px 6px rgba(76,142,255,0.25);}
  button.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,0.35);}
  button.ghost:active{transform:translateY(3px);box-shadow:none;}
  button.danger{background:rgba(255,92,122,0.12);color:var(--red);border:1px solid rgba(255,92,122,0.4);border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:700;box-shadow:0 2px 0 rgba(255,92,122,0.25);}
  button.danger:active{transform:translateY(2px);box-shadow:none;}

  .day-group{margin-bottom:18px;}
  .day-group h3{font-size:12px;color:var(--accent2);font-weight:700;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .match-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .match-card .teams{flex:1;min-width:0;}
  .match-card .teams .t{font-size:13.5px;font-weight:700;line-height:1.7;cursor:pointer;}
  .match-card .meta{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.7;}
  .match-card .meta .venue{color:#9FB4E8;}
  .match-card .score{font-size:17px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;padding:0 6px;text-align:center;min-width:46px;}
  .match-card .score.tbd{color:var(--dim);font-size:11px;font-weight:400;}

  section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 10px 24px rgba(0,0,0,0.25);}
  section.card h2{font-size:14px;font-weight:800;margin:0 0 12px;}

  .admin-gate{padding:40px 10px;text-align:center;}
  .admin-gate p{color:var(--dim);font-size:13px;margin-bottom:16px;}
  .admin-gate .err{color:var(--red);font-size:12px;margin-top:8px;}
  .admin-name{font-size:12px;color:var(--dim);margin-bottom:14px;}
  .admin-name b{color:var(--accent);}

  .list-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;}
  .list-row .info{flex:1;min-width:0;}
  .list-row .info b{font-size:13.5px;}
  .list-row .info .m{font-size:10.5px;color:var(--dim);display:block;margin-top:2px;}
  .badge{font-size:9.5px;padding:3px 8px;border-radius:10px;font-weight:700;}
  .badge.done{background:rgba(61,220,151,0.18);color:var(--win);}
  .badge.pending{background:rgba(124,140,181,0.18);color:var(--dim);}
  .badge.ko{background:rgba(139,108,247,0.2);color:var(--accent2);}

  .result-inputs{display:flex;align-items:center;gap:6px;}
  .result-inputs input{width:42px;text-align:center;padding:6px 4px;flex:none;}

  .details-box{width:100%;background:var(--surface-2);border-radius:10px;padding:12px;margin-top:8px;}
  .details-box h4{font-size:11.5px;color:var(--dim);margin:10px 0 6px;}
  .details-box h4:first-child{margin-top:0;}
  .mini-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .mini-row input,.mini-row select{padding:6px 8px;font-size:12px;}
  .ev-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);}

  .squad-box{width:100%;background:var(--surface-2);border-radius:10px;padding:10px;margin-top:8px;}
  .player-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 10px;font-size:11.5px;margin:3px;}
  .player-chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 2px;}

  nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:flex;box-shadow:0 -8px 24px rgba(0,0,0,0.35);}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:10.3px;font-weight:700;padding:11px 1px 9px;cursor:pointer;position:relative;}
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar button.active::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--accent);border-radius:0 0 3px 3px;box-shadow:0 0 8px var(--accent);}

  .print-preview{background:#fff;color:#111;border-radius:6px;padding:18px;font-size:13px;}
  .print-preview h3{margin:0 0 4px;font-size:16px;}
  .print-preview .pp-sub{font-size:11px;color:#555;margin-bottom:14px;}
  .print-preview table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  .print-preview table th,.print-preview table td{border:1px solid #999;padding:6px 5px;text-align:center;}
  .sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .sheet-box{border:1px solid #999;border-radius:4px;padding:10px;min-height:150px;}
  .sheet-box h4{margin:0 0 8px;font-size:13px;text-align:center;}
  .sheet-line{border-bottom:1px solid #ccc;height:22px;margin-bottom:6px;}
  .sig-row{display:flex;justify-content:space-between;margin-top:20px;font-size:11.5px;gap:10px;}
  .sig-row div{flex:1;text-align:center;}
  .sig-row .line{border-top:1px solid #666;margin-top:26px;padding-top:4px;}

  .news-item{padding:12px 0;border-bottom:1px solid var(--line);}
  .news-item .d{font-size:10.5px;color:var(--dim);margin-bottom:4px;}
  .news-item .t{font-size:13.5px;line-height:1.8;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,16,0.72);z-index:50;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;padding:18px;}
  .modal-box .close-row{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .modal-box h2{font-size:16px;margin:0 0 4px;}

  .log-item{font-size:11px;color:var(--dim);padding:6px 0;border-bottom:1px dashed var(--line);}
  .log-item b{color:var(--text);}

  #loading{padding:60px 20px;text-align:center;color:var(--dim);font-size:13px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    nav.tabbar{display:none;}
  }
</style>

<script>
// ===== Storage adapter (works everywhere: browser localStorage or host storage) =====
const storageAdapter = (window.storage && window.storage.get && window.storage.set) ? {
  get: async (k)=>{ try{ return await window.storage.get(k, true); }catch(e){ return null; } },
  set: async (k,v)=>{ try{ return await window.storage.set(k, v, true); }catch(e){} }
} : {
  get: async (k)=>{ const v = localStorage.getItem(k); return v===null?null:{value:v}; },
  set: async (k,v)=>{ localStorage.setItem(k,v); }
};
</script>

function t(k){ return (DICT[k] && DICT[k][ui.lang]) || k; }

let state = { season:'الموسم 2026', teams: [], matches: [], news: [], admins: [], log: [], archives: [] };
let ui = { lang:'ar', tab: 'standings', scheduleSub: 'daily', scorersSub:'top', printSub: 'sheet', isAdmin: false, adminName:'', adminError: '', expandedMatch:null, expandedTeam:null };
const STORAGE_KEY = 'tournament-data-v1';

function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return p+Date.now()+Math.random().toString(36).slice(2,6); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

async function loadData(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      const p = JSON.parse(res.value);
      state.season = p.season || state.season;
      state.teams = p.teams || []; state.matches = p.matches || []; state.news = p.news || [];
      state.admins = p.admins || []; state.log = p.log || []; state.archives = p.archives || [];
    }
  }catch(e){}
  if(state.admins.length===0){ state.admins.push({pin:'2580', name:'المسير الرئيسي'}); }
}
async function saveData(){
  try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error(e); alert(ui.lang==='fr' ? "Une erreur est survenue lors de l'enregistrement." : 'حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى.'); }
}
function addLog(actionAr, actionFr){ state.log.unshift({ts:Date.now(), admin: ui.adminName||'—', action: ui.lang==='fr' ? (actionFr||actionAr) : actionAr}); state.log = state.log.slice(0,40); }

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(ui.lang==='fr'){
    const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months=['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function getWeekRange(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const diffToSat = (d.getDay()+1)%7;
  const start = new Date(d); start.setDate(d.getDate()-diffToSat);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
}

function teamName(id, teamsArg){ const teams = teamsArg||state.teams; const tm = teams.find(t=>t.id===id); return tm?tm.name:'—'; }
function teamColor(id, teamsArg){ const teams = teamsArg||state.teams; const tm = teams.find(t=>t.id===id); return (tm&&tm.color)||'#4C8EFF'; }

function computeStandings(teamsArg, matchesArg){
  const teams = teamsArg||state.teams, matches = matchesArg||state.matches;
  const map = {};
  teams.forEach(tm=>{ map[tm.id] = {id:tm.id, name:tm.name, color:tm.color, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, pts:0}; });
  matches.forEach(m=>{
    if(m.status!=='finished') return;
    const h = map[m.home], a = map[m.away];
    if(!h||!a) return;
    h.played++; a.played++; h.gf+=m.homeScore; h.ga+=m.awayScore; a.gf+=m.awayScore; a.ga+=m.homeScore;
    if(m.homeScore>m.awayScore){ h.won++; h.pts+=3; a.lost++; }
    else if(m.homeScore<m.awayScore){ a.won++; a.pts+=3; h.lost++; }
    else { h.drawn++; a.drawn++; h.pts+=1; a.pts+=1; }
  });
  const arr = Object.values(map);
  arr.sort((x,y)=>{ if(y.pts!==x.pts) return y.pts-x.pts; const gx=x.gf-x.ga, gy=y.gf-y.ga; if(gy!==gx) return gy-gx; return y.gf-x.gf; });
  return arr;
}
function computeTopScorers(){
  const acc = {};
  state.matches.forEach(m=>{
    (m.events||[]).filter(e=>e.type==='goal').forEach(e=>{
      const teamId = e.side==='home'?m.home:m.away;
      const key = e.player+'|'+teamId;
      if(!acc[key]) acc[key] = {player:e.player, teamId, goals:0};
      acc[key].goals += (e.count||1);
    });
  });
  return Object.values(acc).sort((a,b)=>b.goals-a.goals).slice(0,20);
}
function computeCardsTable(){
  const map = {};
  state.teams.forEach(tm=>{ map[tm.id] = {id:tm.id, name:tm.name, color:tm.color, yellow:0, red:0}; });
  state.matches.forEach(m=>{
    (m.events||[]).forEach(e=>{
      if(e.type!=='yellow' && e.type!=='red') return;
      const teamId = e.side==='home'?m.home:m.away;
      if(!map[teamId]) return;
      if(e.type==='yellow') map[teamId].yellow++; else map[teamId].red++;
    });
  });
  const arr = Object.values(map).map(tm=>({...tm, pts:tm.yellow*1+tm.red*3}));
  arr.sort((a,b)=>a.pts-b.pts);
  return arr;
}
function nextUpcomingMatch(){
  const now = Date.now();
  const list = state.matches.filter(m=>m.status!=='finished').map(m=>{
    const dt = new Date(m.date+'T'+(m.time||'00:00')+':00').getTime();
    return {m, dt};
  }).filter(x=>x.dt>=now-3600000).sort((a,b)=>a.dt-b.dt);
  return list.length? list[0] : null;
}
function matchLine(m){
  const status = m.status==='finished';
  return `
    <div class="match-card">
      <div class="teams">
        <div class="t" data-open-team="${m.home}"><span class="dot" style="background:${esc(teamColor(m.home))}"></span>${esc(teamName(m.home))}</div>
        <div class="t" data-open-team="${m.away}"><span class="dot" style="background:${esc(teamColor(m.away))}"></span>${esc(teamName(m.away))}</div>
        <div class="meta">${m.time?m.time+' · ':''}<span class="venue">${t('venueLbl')}${m.venue?esc(m.venue):t('venueUnset')}</span>${m.round?' · '+esc(m.round):''}${m.stage==='knockout'?' <span class="badge ko">'+t('koBadge')+'</span>':''}</div>
      </div>
      <div class="score ${status?'':'tbd'}">${status ? m.homeScore+' - '+m.awayScore : t('notPlayed')}</div>
    </div>`;
}
function groupByDate(matches){
  const groups = {};
  matches.forEach(m=>{ (groups[m.date]=groups[m.date]||[]).push(m); });
  return Object.keys(groups).sort().map(date=>({date, list:groups[date].sort((a,b)=>(a.time||'').localeCompare(b.time||''))}));
}
function shareText(text){ window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank'); }

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tournoi-backup-'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert(t('importError')); return; }
    if(!confirm(t('importWarning'))) return;
    state.season = parsed.season || state.season;
    state.teams = parsed.teams || [];
    state.matches = parsed.matches || [];
    state.news = parsed.news || [];
    state.admins = (parsed.admins && parsed.admins.length) ? parsed.admins : state.admins;
    state.log = parsed.log || [];
    state.archives = parsed.archives || [];
    addLog('استورد نسخة احتياطية', 'Sauvegarde importée');
    await saveData();
    ui.isAdmin = true;
    render();
    alert(t('importSuccess'));
  };
  reader.readAsText(file);
}

function applyLangDom(){
  document.getElementById('htmlRoot').setAttribute('dir', ui.lang==='fr'?'ltr':'rtl');
  document.getElementById('htmlRoot').setAttribute('lang', ui.lang);
  document.getElementById('appTitleH1').textContent = t('appTitle');
  document.getElementById('appSubtitleDiv').textContent = t('appSubtitle');
  document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('active', b.dataset.lang===ui.lang));
  const labels = {standings:'tabStandings', schedule:'tabSchedule', scorers:'tabScorers', news:'tabNews', print:'tabPrint', admin:'tabAdmin'};
  document.querySelectorAll('nav.tabbar button').forEach(b=>{ b.textContent = t(labels[b.dataset.tab]); });
}

function render(){
  applyLangDom();
  document.getElementById('seasonBadge').textContent = state.season;
  document.getElementById('tabbar').style.display='flex';
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===ui.tab));
  const main = document.getElementById('main');
  if(ui.tab==='standings') main.innerHTML = renderStandings();
  else if(ui.tab==='schedule') main.innerHTML = renderSchedule();
  else if(ui.tab==='scorers') main.innerHTML = renderScorers();
  else if(ui.tab==='news') main.innerHTML = renderNews();
  else if(ui.tab==='print') main.innerHTML = renderPrint();
  else if(ui.tab==='admin') main.innerHTML = renderAdmin();
  attachHandlers();
  updateCountdown();
}

function renderStandings(){
  const groupsPresent = [...new Set(state.teams.map(tm=>tm.group).filter(Boolean))].sort();
  let groupTabs = '';
  let standingsTeams = state.teams;
  if(groupsPresent.length>0){
    const cur = ui.standingsGroup || 'all';
    groupTabs = `<div class="subtabs">
      <button data-stgroup="all" class="${cur==='all'?'active':''}">${t('allGroups')}</button>
      ${groupsPresent.map(g=>`<button data-stgroup="${esc(g)}" class="${cur===g?'active':''}">${esc(g)}</button>`).join('')}
    </div>`;
    if(cur!=='all') standingsTeams = state.teams.filter(tm=>tm.group===cur);
  }
  const standings = computeStandings(standingsTeams);
  const next = nextUpcomingMatch();
  let banner = '';
  if(next){
    banner = `<div class="banner"><div><div class="lbl">${t('nextMatch')}</div>
      <div class="teams">${esc(teamName(next.m.home))} × ${esc(teamName(next.m.away))}</div></div>
      <div class="cd" id="countdownBox" data-ts="${next.dt}">--:--:--</div></div>`;
  }
  const toolbar = state.teams.length ? `<div class="toolbar"><button class="ghost" id="shareStandings">${t('share')}</button></div>` : '';
  if(state.teams.length===0){
    return banner+groupTabs+toolbar+`<div class="empty-note">${t('noTeamsYet')}</div>`;
  }
  const rows = standings.map((tm,i)=>`
    <tr class="${i<3?'top3':''}">
      <td>${i+1}</td>
      <td class="name-col" data-open-team="${tm.id}"><span class="dot" style="background:${esc(tm.color||'#4C8EFF')}"></span>${esc(tm.name)}</td>
      <td>${tm.played}</td><td>${tm.won}</td><td>${tm.drawn}</td><td>${tm.lost}</td>
      <td>${tm.gf}</td><td>${tm.ga}</td><td>${tm.gf-tm.ga}</td><td class="pts">${tm.pts}</td>
    </tr>`).join('');
  return banner+groupTabs+toolbar+`
    <table class="standings"><thead><tr>
      <th>${t('colRank')}</th><th class="name-col">${t('colTeam')}</th><th>${t('colPlayed')}</th><th>${t('colWon')}</th><th>${t('colDrawn')}</th><th>${t('colLost')}</th><th>${t('colFor')}</th><th>${t('colAgainst')}</th><th>${t('colDiff')}</th><th>${t('colPts')}</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}
function updateCountdown(){
  const box = document.getElementById('countdownBox');
  if(!box) return;
  const ts = parseInt(box.dataset.ts,10);
  const diff = ts - Date.now();
  if(diff<=0){ box.textContent=t('now'); return; }
  const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000);
  box.textContent = d>0 ? `${d}${t('cdDay')} ${h}${t('cdHour')} ${m}${t('cdMin')}` : `${h}${t('cdHour')} ${m}${t('cdMin')}`;
}
setInterval(updateCountdown, 30000);

function renderSchedule(){
  const subs = [['daily','subDaily'],['weekly','subWeekly'],['monthly','subMonthly'],['general','subGeneral'],['knockout','subKnockout']];
  const subtabs = subs.map(([k,lk])=>`<button data-sched="${k}" class="${ui.scheduleSub===k?'active':''}">${t(lk)}</button>`).join('');

  if(ui.scheduleSub==='knockout'){
    const ko = state.matches.filter(m=>m.stage==='knockout').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
    if(ko.length===0) return `<div class="subtabs">${subtabs}</div><div class="empty-note">${t('noKnockoutYet')}</div>`;
    const rounds = {}; const order=[];
    ko.forEach(m=>{ const r = m.round||t('undefinedRound'); if(!rounds[r]){rounds[r]=[]; order.push(r);} rounds[r].push(m); });
    const body = order.map(r=>`<div class="day-group"><h3>${esc(r)}</h3>${rounds[r].map(matchLine).join('')}</div>`).join('');
    return `<div class="subtabs">${subtabs}</div>${body}`;
  }
  let controls='', list=[];
  const val = ui.scheduleValue || todayISO();
  if(ui.scheduleSub==='daily'){
    controls = `<div class="field-row"><label>${t('lblDate')}</label><input type="date" id="schedDate" value="${val}"></div>`;
    list = state.matches.filter(m=>m.date===val);
  } else if(ui.scheduleSub==='weekly'){
    controls = `<div class="field-row"><label>${t('lblWeekDay')}</label><input type="date" id="schedDate" value="${val}"></div>`;
    const {start,end} = getWeekRange(val);
    list = state.matches.filter(m=>m.date>=start && m.date<=end);
  } else if(ui.scheduleSub==='monthly'){
    const monthVal = (ui.scheduleValue||todayISO()).slice(0,7);
    controls = `<div class="field-row"><label>${t('lblMonth')}</label><input type="month" id="schedMonth" value="${monthVal}"></div>`;
    list = state.matches.filter(m=>m.date.slice(0,7)===monthVal);
  } else { list = state.matches.slice(); }
  list.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const groups = groupByDate(list);
  const body = groups.length===0 ? `<div class="empty-note">${t('noMatchesPeriod')}</div>`
    : groups.map(g=>`<div class="day-group"><h3>${formatDate(g.date)}</h3>${g.list.map(matchLine).join('')}</div>`).join('');
  return `<div class="subtabs">${subtabs}</div>${controls}${body}`;
}

function renderScorers(){
  const subs = [['top','scTop'],['gk','scGk'],['fair','scFair']];
  const subtabs = subs.map(([k,lk])=>`<button data-scsub="${k}" class="${ui.scorersSub===k?'active':''}">${t(lk)}</button>`).join('');
  if(ui.scorersSub==='top'){
    const top = computeTopScorers();
    if(top.length===0) return `<div class="subtabs">${subtabs}</div><div class="empty-note">${t('noGoalsYet')}</div>`;
    const rows = top.map((tm,i)=>`<tr><td>${i+1}</td><td class="name-col">${esc(tm.player)}</td><td>${esc(teamName(tm.teamId))}</td><td class="pts">${tm.goals}</td></tr>`).join('');
    return `<div class="subtabs">${subtabs}</div><table class="standings"><thead><tr><th>${t('colRank')}</th><th class="name-col">${t('colPlayer')}</th><th>${t('colTeam')}</th><th>${t('colGoals')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(ui.scorersSub==='gk'){
    const st = computeStandings().filter(tm=>tm.played>0).sort((a,b)=>a.ga-b.ga).slice(0,10);
    if(st.length===0) return `<div class="subtabs">${subtabs}</div><div class="empty-note">${t('noFinishedYet')}</div>`;
    const rows = st.map((tm,i)=>`<tr><td>${i+1}</td><td class="name-col">${esc(tm.name)}</td><td>${tm.played}</td><td class="pts">${tm.ga}</td></tr>`).join('');
    return `<div class="subtabs">${subtabs}</div><table class="standings"><thead><tr><th>${t('colRank')}</th><th class="name-col">${t('colTeam')}</th><th>${t('colPlayed')}</th><th>${t('colConceded')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  const fair = computeCardsTable();
  if(state.teams.length===0) return `<div class="subtabs">${subtabs}</div><div class="empty-note">${t('noTeamsShort')}</div>`;
  const rows = fair.map((tm,i)=>`<tr><td>${i+1}</td><td class="name-col">${esc(tm.name)}</td><td>${tm.yellow}</td><td>${tm.red}</td><td class="pts">${tm.pts}</td></tr>`).join('');
  return `<div class="subtabs">${subtabs}</div><table class="standings"><thead><tr><th>${t('colRank')}</th><th class="name-col">${t('colTeam')}</th><th>${t('colYellow')}</th><th>${t('colRed')}</th><th>${t('colPts')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderNews(){
  if(state.news.length===0) return `<div class="empty-note">${t('noNewsYet')}</div>`;
  return state.news.slice().sort((a,b)=>b.ts-a.ts).map(n=>`<div class="news-item"><div class="d">${formatDate(n.date)}</div><div class="t">${esc(n.text)}</div></div>`).join('');
}

function renderPrint(){
  const subs = [['sheet','psSheet'],['schedule','psSchedule']];
  const subtabs = subs.map(([k,lk])=>`<button data-psub="${k}" class="${ui.printSub===k?'active':''}">${t(lk)}</button>`).join('');
  if(ui.printSub==='sheet'){
    if(state.matches.length===0) return `<div class="subtabs">${subtabs}</div><div class="empty-note">${t('noMatchesForSheet')}</div>`;
    const options = state.matches.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<option value="${m.id}" ${ui.selectedMatch===m.id?'selected':''}>${esc(teamName(m.home))} × ${esc(teamName(m.away))} — ${formatDate(m.date)}</option>`).join('');
    const mId = ui.selectedMatch || state.matches[0].id;
    const m = state.matches.find(x=>x.id===mId);
    return `<div class="subtabs">${subtabs}</div>
      <div class="field-row"><select id="matchSelect" style="flex:1">${options}</select></div>
      <div class="print-preview" id="sheetPreview">${buildMatchSheetHTML(m)}</div>
      <div class="field-row"><button class="primary" id="printSheetBtn">${t('printSheetBtn')}</button></div>`;
  }
  const period = ui.printPeriod||'daily';
  const val = ui.printValue||todayISO();
  let list=[], label='';
  if(period==='daily'){ list=state.matches.filter(m=>m.date===val); label=formatDate(val); }
  else if(period==='weekly'){ const {start,end}=getWeekRange(val); list=state.matches.filter(m=>m.date>=start&&m.date<=end); label=`${t('fromTo')}${formatDate(start)}${t('toWord')}${formatDate(end)}`; }
  else { list=state.matches.slice(); label=t('seasonAll'); }
  list.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  return `<div class="subtabs">${subtabs}</div>
    <div class="field-row">
      <select id="periodSelect">
        <option value="daily" ${period==='daily'?'selected':''}>${t('subDaily')}</option>
        <option value="weekly" ${period==='weekly'?'selected':''}>${t('subWeekly')}</option>
        <option value="general" ${period==='general'?'selected':''}>${t('subGeneral')}</option>
      </select>
      ${period!=='general' ? `<input type="date" id="periodDate" value="${val}">` : ''}
    </div>
    <div class="print-preview" id="schedulePreview">${buildScheduleSheetHTML(list,label)}</div>
    <div class="field-row"><button class="primary" id="printSchedBtn">${t('printSchedBtn')}</button></div>`;
}
function buildMatchSheetHTML(m){
  if(!m) return '';
  return `
    <h3>${t('appTitle')}</h3>
    <div class="pp-sub">${t('officialSheet')} ${m.round?' — '+esc(m.round):''}</div>
    <table>
      <tr><td>${t('lblDate')}</td><td>${formatDate(m.date)}</td><td>${t('time')}</td><td>${esc(m.time||'—')}</td></tr>
      <tr><td>${t('venue')}</td><td colspan="3">${esc(m.venue||t('venueUnset'))}</td></tr>
    </table>
    <div class="sheet-grid">
      <div class="sheet-box"><h4>${esc(teamName(m.home))}</h4><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div></div>
      <div class="sheet-box"><h4>${esc(teamName(m.away))}</h4><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div></div>
    </div>
    <table style="margin-top:14px">
      <tr><td>${t('finalResult')}</td><td style="width:70%">${m.status==='finished'?m.homeScore+' — '+m.awayScore:'____________'}</td></tr>
      <tr><td>${t('refNotes')}</td><td>&nbsp;</td></tr>
    </table>
    <div class="sig-row">
      <div class="line">${t('refSig')}</div>
      <div class="line">${t('mgrSig')} ${esc(teamName(m.home))}</div>
      <div class="line">${t('mgrSig')} ${esc(teamName(m.away))}</div>
    </div>`;
}
function buildScheduleSheetHTML(list,label){
  const rows = list.map(m=>`<tr><td>${formatDate(m.date)}</td><td>${esc(m.time||'—')}</td><td>${esc(teamName(m.home))}</td><td>${esc(teamName(m.away))}</td><td>${esc(m.venue||t('venueUnset'))}</td><td>${esc(m.round||'—')}</td></tr>`).join('');
  return `<h3>${t('appTitle')}</h3><div class="pp-sub">${t('scheduleTitle')}${label}</div>
    <table><tr><th>${t('lblDate')}</th><th>${t('time')}</th><th>${t('colTeam1')}</th><th>${t('colTeam2')}</th><th>${t('venue')}</th><th>${t('colRound')}</th></tr>${rows||'<tr><td colspan="6">'+t('noMatchesTable')+'</td></tr>'}</table>`;
}

function openTeamModal(teamId){
  const tm = state.teams.find(x=>x.id===teamId);
  if(!tm) return;
  const upcoming = state.matches.filter(m=>(m.home===teamId||m.away===teamId)&&m.status!=='finished').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,5);
  const past = state.matches.filter(m=>(m.home===teamId||m.away===teamId)&&m.status==='finished').sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).slice(0,5);
  const players = (tm.players||[]).map(p=>`<span class="player-chip">${esc(p.name)}</span>`).join('') || `<span style="font-size:12px;color:var(--dim)">${t('modalNoSquad')}</span>`;
  const upHTML = upcoming.map(matchLine).join('') || `<div class="empty-note" style="padding:14px 0">${t('modalNoUpcoming')}</div>`;
  const pastHTML = past.map(matchLine).join('') || `<div class="empty-note" style="padding:14px 0">${t('modalNoPast')}</div>`;
  document.getElementById('teamModalBox').innerHTML = `
    <div class="close-row"><button class="ghost" id="closeTeamModal">${t('modalClose')}</button></div>
    <h2><span class="dot" style="background:${esc(tm.color||'#4C8EFF')}"></span>${esc(tm.name)}</h2>
    <h4 style="font-size:11.5px;color:var(--dim);margin:14px 0 8px">${t('modalSquad')}</h4>
    <div>${players}</div>
    <h4 style="font-size:11.5px;color:var(--dim);margin:16px 0 4px">${t('modalUpcoming')}</h4>${upHTML}
    <h4 style="font-size:11.5px;color:var(--dim);margin:16px 0 4px">${t('modalPast')}</h4>${pastHTML}
  `;
  document.getElementById('teamModal').classList.add('open');
  document.getElementById('closeTeamModal').onclick = ()=> document.getElementById('teamModal').classList.remove('open');
}
function viewArchiveStandings(seasonName){
  const ar = state.archives.find(a=>a.season===seasonName);
  if(!ar) return;
  const st = computeStandings(ar.teams, ar.matches);
  const rows = st.map((tm,i)=>`<tr class="${i<3?'top3':''}"><td>${i+1}</td><td class="name-col">${esc(tm.name)}</td><td>${tm.played}</td><td>${tm.won}</td><td>${tm.drawn}</td><td>${tm.lost}</td><td>${tm.gf}</td><td>${tm.ga}</td><td>${tm.gf-tm.ga}</td><td class="pts">${tm.pts}</td></tr>`).join('') || `<tr><td colspan="10">—</td></tr>`;
  document.getElementById('teamModalBox').innerHTML = `
    <div class="close-row"><button class="ghost" id="closeTeamModal">${t('modalClose')}</button></div>
    <h2>${t('archiveStandingsTitle')}${esc(seasonName)}</h2>
    <table class="standings" style="margin-top:10px"><thead><tr><th>${t('colRank')}</th><th class="name-col">${t('colTeam')}</th><th>${t('colPlayed')}</th><th>${t('colWon')}</th><th>${t('colDrawn')}</th><th>${t('colLost')}</th><th>${t('colFor')}</th><th>${t('colAgainst')}</th><th>${t('colDiff')}</th><th>${t('colPts')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('teamModal').classList.add('open');
  document.getElementById('closeTeamModal').onclick = ()=> document.getElementById('teamModal').classList.remove('open');
}

function attachHandlers(){
  document.querySelectorAll('#langsw button').forEach(b=>{ b.onclick = ()=>{ ui.lang = b.dataset.lang; render(); }; });
  document.querySelectorAll('nav.tabbar button').forEach(b=>{ b.onclick = ()=>{ ui.tab=b.dataset.tab; render(); }; });
  document.querySelectorAll('[data-open-team]').forEach(el=>{ el.onclick = ()=> openTeamModal(el.dataset.openTeam); });

  if(ui.tab==='standings'){
    document.querySelectorAll('[data-stgroup]').forEach(b=>{ b.onclick=()=>{ ui.standingsGroup=b.dataset.stgroup; render(); }; });
    const sb = document.getElementById('shareStandings');
    if(sb) sb.onclick = ()=>{
      const groupsPresent = [...new Set(state.teams.map(tm=>tm.group).filter(Boolean))];
      const cur = ui.standingsGroup || 'all';
      const shareTeams = (groupsPresent.length>0 && cur!=='all') ? state.teams.filter(tm=>tm.group===cur) : state.teams;
      const st = computeStandings(shareTeams);
      let text = t('shareIntro')+state.season+(cur!=='all'?' — '+cur:'')+'\n'+t('shareStandingsLbl');
      st.forEach((tm,i)=>{ text += `${i+1}. ${tm.name} — ${tm.pts}${t('ptsWord')}\n`; });
      shareText(text);
    };
  }
  if(ui.tab==='schedule'){
    document.querySelectorAll('[data-sched]').forEach(b=>{ b.onclick=()=>{ ui.scheduleSub=b.dataset.sched; ui.scheduleValue=todayISO(); render(); }; });
    const sd = document.getElementById('schedDate'); if(sd) sd.onchange=()=>{ ui.scheduleValue=sd.value; render(); };
    const sm = document.getElementById('schedMonth'); if(sm) sm.onchange=()=>{ ui.scheduleValue=sm.value+'-01'; render(); };
  }
  if(ui.tab==='scorers'){ document.querySelectorAll('[data-scsub]').forEach(b=>{ b.onclick=()=>{ ui.scorersSub=b.dataset.scsub; render(); }; }); }
  if(ui.tab==='print'){
    document.querySelectorAll('[data-psub]').forEach(b=>{ b.onclick=()=>{ ui.printSub=b.dataset.psub; render(); }; });
    const ms = document.getElementById('matchSelect'); if(ms) ms.onchange=()=>{ ui.selectedMatch=ms.value; render(); };
    const psBtn = document.getElementById('printSheetBtn');
    if(psBtn) psBtn.onclick=()=>{ document.getElementById('printArea').innerHTML = document.getElementById('sheetPreview').innerHTML; window.print(); };
    const perSel = document.getElementById('periodSelect'); if(perSel) perSel.onchange=()=>{ ui.printPeriod=perSel.value; render(); };
    const perDate = document.getElementById('periodDate'); if(perDate) perDate.onchange=()=>{ ui.printValue=perDate.value; render(); };
    const schedBtn = document.getElementById('printSchedBtn');
    if(schedBtn) schedBtn.onclick=()=>{ document.getElementById('printArea').innerHTML = document.getElementById('schedulePreview').innerHTML; window.print(); };
  }
  if(ui.tab==='admin'){
    const pinBtn = document.getElementById('pinBtn');
    if(pinBtn) pinBtn.onclick=()=>{
      const val = document.getElementById('pinInput').value;
      const found = state.admins.find(a=>a.pin===val);
      if(found){ ui.isAdmin=true; ui.adminName=found.name; ui.adminError=''; render(); }
      else { ui.adminError=t('wrongPin'); render(); }
    };
    const logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.onclick=()=>{ ui.isAdmin=false; ui.adminName=''; render(); };

    const addTeamBtn = document.getElementById('addTeamBtn');
    if(addTeamBtn) addTeamBtn.onclick = async ()=>{
      const name = document.getElementById('newTeamName').value.trim();
      const color = document.getElementById('newTeamColor').value;
      const group = document.getElementById('newTeamGroup').value.trim();
      if(!name) return;
      state.teams.push({id:uid('t'), name, color, group, players:[]});
      addLog(`أضاف فريق «${name}»${group?' - مجموعة '+group:''}`, `Équipe ajoutée : « ${name} »${group?' - groupe '+group:''}`);
      await saveData(); render();
    };
    document.querySelectorAll('[data-save-group]').forEach(b=>{
      b.onclick = async ()=>{
        const tid = b.dataset.saveGroup;
        const val = document.getElementById('editGroup_'+tid).value.trim();
        const tm = state.teams.find(x=>x.id===tid);
        if(tm){ tm.group = val; }
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-toggle-team]').forEach(b=>{ b.onclick=()=>{ ui.expandedTeam = ui.expandedTeam===b.dataset.toggleTeam ? null : b.dataset.toggleTeam; render(); }; });
    document.querySelectorAll('[data-add-player]').forEach(b=>{
      b.onclick = async ()=>{
        const tid = b.dataset.addPlayer;
        const input = document.getElementById('newPlayer_'+tid);
        const name = input.value.trim();
        if(!name) return;
        const tm = state.teams.find(x=>x.id===tid);
        if(!tm.players) tm.players=[];
        tm.players.push({id:uid('p'), name});
        addLog(`أضاف اللاعب ${name} إلى ${tm.name}`, `Joueur ajouté : ${name} (${tm.name})`);
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-del-player]').forEach(b=>{
      b.onclick = async ()=>{
        const [tid,pid] = b.dataset.delPlayer.split('|');
        const tm = state.teams.find(x=>x.id===tid);
        if(tm){ tm.players = (tm.players||[]).filter(p=>p.id!==pid); }
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-del-team]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delTeam;
        if(!confirm(t('confirmDeleteTeam'))) return;
        const tm = state.teams.find(x=>x.id===id);
        state.teams = state.teams.filter(t2=>t2.id!==id);
        state.matches = state.matches.filter(m=>m.home!==id && m.away!==id);
        addLog(`حذف فريق «${tm?tm.name:''}»`, `Équipe supprimée : « ${tm?tm.name:''} »`);
        await saveData(); render();
      };
    });

    const addMatchBtn = document.getElementById('addMatchBtn');
    if(addMatchBtn) addMatchBtn.onclick = async ()=>{
      const home = document.getElementById('matchHome').value;
      const away = document.getElementById('matchAway').value;
      if(!home || !away || home===away){ alert(t('chooseTwoTeams')); return; }
      const date = document.getElementById('matchDate').value;
      if(!date){ alert(t('chooseDate')); return; }
      const time = document.getElementById('matchTime').value.trim();
      const venue = document.getElementById('matchVenue').value.trim();
      const round = document.getElementById('matchRound').value.trim();
      const stage = document.getElementById('matchStage').value;
      state.matches.push({id:uid('m'), home, away, date, time, venue, round, stage, homeScore:null, awayScore:null, status:'scheduled', events:[]});
      addLog(`برمج مباراة ${teamName(home)} × ${teamName(away)}`, `Match programmé : ${teamName(home)} × ${teamName(away)}`);
      await saveData(); render();
    };
    document.querySelectorAll('[data-save-result]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.saveResult;
        const hVal = document.querySelector(`[data-score-home="${id}"]`).value;
        const aVal = document.querySelector(`[data-score-away="${id}"]`).value;
        const m = state.matches.find(x=>x.id===id);
        if(hVal===''||aVal===''){ m.homeScore=null; m.awayScore=null; m.status='scheduled'; }
        else { m.homeScore=parseInt(hVal,10); m.awayScore=parseInt(aVal,10); m.status='finished'; }
        addLog(`حدّث نتيجة ${teamName(m.home)} × ${teamName(m.away)}`, `Résultat mis à jour : ${teamName(m.home)} × ${teamName(m.away)}`);
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-toggle-match]').forEach(b=>{ b.onclick=()=>{ ui.expandedMatch = ui.expandedMatch===b.dataset.toggleMatch ? null : b.dataset.toggleMatch; render(); }; });
    document.querySelectorAll('[data-add-goal]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.addGoal;
        const side = document.getElementById('goalSide_'+id).value;
        const player = document.getElementById('goalPlayer_'+id).value.trim();
        const count = parseInt(document.getElementById('goalCount_'+id).value,10)||1;
        if(!player) return;
        const m = state.matches.find(x=>x.id===id);
        if(!m.events) m.events=[];
        m.events.push({id:uid('e'), type:'goal', side, player, count});
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-add-card]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.addCard;
        const side = document.getElementById('cardSide_'+id).value;
        const player = document.getElementById('cardPlayer_'+id).value.trim();
        const type = document.getElementById('cardType_'+id).value;
        if(!player) return;
        const m = state.matches.find(x=>x.id===id);
        if(!m.events) m.events=[];
        m.events.push({id:uid('e'), type, side, player, count:1});
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-del-event]').forEach(b=>{
      b.onclick = async ()=>{
        const [mid,eid] = b.dataset.delEvent.split('|');
        const m = state.matches.find(x=>x.id===mid);
        if(m){ m.events = (m.events||[]).filter(e=>e.id!==eid); }
        await saveData(); render();
      };
    });
    document.querySelectorAll('[data-del-match]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delMatch;
        if(!confirm(t('confirmDeleteMatch'))) return;
        state.matches = state.matches.filter(m=>m.id!==id);
        await saveData(); render();
      };
    });
    const addNewsBtn = document.getElementById('addNewsBtn');
    if(addNewsBtn) addNewsBtn.onclick = async ()=>{
      const input = document.getElementById('newNewsText');
      const text = input.value.trim();
      if(!text) return;
      state.news.push({id:uid('n'), date:todayISO(), text, ts:Date.now()});
      addLog(`نشر إعلان: ${text.slice(0,30)}`, `Annonce publiée : ${text.slice(0,30)}`);
      await saveData(); render();
    };
    document.querySelectorAll('[data-del-news]').forEach(b=>{ b.onclick = async ()=>{ state.news = state.news.filter(n=>n.id!==b.dataset.delNews); await saveData(); render(); }; });

    const archiveBtn = document.getElementById('archiveBtn');
    if(archiveBtn) archiveBtn.onclick = async ()=>{
      const name = document.getElementById('newSeasonName').value.trim();
      if(!name){ alert(t('enterSeasonName')); return; }
      if(!confirm(t('confirmArchive'))) return;
      state.archives.push({season: state.season, teams: state.teams, matches: state.matches, archivedAt: todayISO()});
      addLog(`أرشف موسم «${state.season}» وبدأ «${name}»`, `Saison « ${state.season} » archivée, nouvelle saison « ${name} »`);
      state.teams = []; state.matches = [];
      state.season = name;
      await saveData(); render();
    };
    document.querySelectorAll('[data-view-archive]').forEach(b=>{ b.onclick=()=> viewArchiveStandings(b.dataset.viewArchive); });

    const addAdminBtn = document.getElementById('addAdminBtn');
    if(addAdminBtn) addAdminBtn.onclick = async ()=>{
      const name = document.getElementById('newAdminName').value.trim();
      const pin = document.getElementById('newAdminPin').value.trim();
      if(!name||!pin){ alert(t('enterManagerFields')); return; }
      state.admins.push({name, pin});
      addLog(`أضاف مسيراً جديداً: ${name}`, `Nouvel organisateur ajouté : ${name}`);
      await saveData(); render();
    };

    const exportBtn = document.getElementById('exportBackupBtn');
    if(exportBtn) exportBtn.onclick = exportBackup;
    const importBtn = document.getElementById('importBackupBtn');
    const importInput = document.getElementById('importBackupInput');
    if(importBtn && importInput) importBtn.onclick = ()=> importInput.click();
    if(importInput) importInput.onchange = (e)=>{ const f = e.target.files[0]; if(f) importBackupFile(f); e.target.value=''; };
  }
}

(async function init(){
  await loadData();
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
